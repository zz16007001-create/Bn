<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112D52"/>
      <stop offset="100%" stop-color="#071529"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C35C"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9E7B14"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#navyBg)"/>

  <!-- Subtle Outer Gold Ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.35"/>

  <!-- Aromatic Gold Steam -->
  <path d="M214 152 C202 126, 224 106, 214 82" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 142 C242 110, 270 88, 256 60" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M298 152 C286 126, 308 106, 298 82" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Coffee Cup Body (Crisp White) -->
  <path d="M148 196 H352 V284 C352 342, 308 378, 250 378 C192 378, 148 342, 148 284 Z" fill="#FFFFFF"/>

  <!-- Cup Handle -->
  <path d="M350 218 H378 C406 218, 422 238, 422 264 C422 290, 404 308, 376 308 H346" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

  <!-- Cup Rim Gold Highlight -->
  <rect x="140" y="186" width="220" height="16" rx="8" fill="url(#goldGrad)"/>

  <!-- Stylized Coffee Bean Emblem Inside Cup -->
  <g transform="translate(250, 286) rotate(-22)">
    <ellipse cx="0" cy="0" rx="34" ry="46" fill="#0B1F3A"/>
    <path d="M-2 -42 C14 -16, -14 16, 2 42" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Saucer -->
  <path d="M118 394 H382 C372 416, 344 426, 250 426 C156 426, 128 416, 118 394 Z" fill="url(#goldGrad)"/>
</svg>
