name: Unzip project

on:
  push:
    branches: [main]
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          ZIP=$(find . -path ./.git -prune -o -iname '*.zip' -print | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No .zip file found. Files in repo:"
            ls -la
            exit 1
          fi
          echo "Using: $ZIP"

          mkdir /tmp/extracted
          unzip -q "$ZIP" -d /tmp/extracted -x "__MACOSX/*"

          SRC=/tmp/extracted
          if [ "$(ls -A $SRC | wc -l)" = "1" ] && [ -d "$SRC/$(ls -A $SRC)" ]; then
            SRC="$SRC/$(ls -A $SRC)"
          fi
          test -f "$SRC/package.json" || { echo "package.json not found in zip"; exit 1; }
          rm -rf "$SRC/.github"

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract zip"
            git push
          fi
